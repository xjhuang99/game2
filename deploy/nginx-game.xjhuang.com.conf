# Nginx site for game.xjhuang.com → Flask-SocketIO on 127.0.0.1:5001
# Install: sudo cp deploy/nginx-game.xjhuang.com.conf /etc/nginx/sites-available/game.xjhuang.com
#          sudo ln -sf /etc/nginx/sites-available/game.xjhuang.com /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# HTTPS:   sudo certbot --nginx -d game.xjhuang.com

server {
    listen 80;
    listen [::]:80;
    server_name game.xjhuang.com;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
